<style>
  /* Creator Pipeline design tokens, same names as Craftbench. Light by default, dark when the viewer's system is dark. */
  :root {

    --bg: #f5f2e9;
    --surface: #ffffff;
    --surface-2: #efebe0;
    --line-strong: #7d7663;
    --text: #1c1a12;

    --focus: #8a5a00;
    --bad: #a8402a;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 40px;
    --r-outer: 16px;
    --pad: 8px;
    --r-inner: calc(var(--r-outer) - var(--pad));
    --font: "Segoe UI", system-ui, sans-serif;
    --t-fast: 120ms;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12140f;
      --surface: #1b1f18;
      --surface-2: #20251c;
      --line-strong: #78836a;
      --text: #f3efe2;
      --text-muted: #b9b19d;

      --bad: #e8826a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: var(--s5) var(--s4) var(--s6);
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 var(--font);

  }
  main { max-width: 880px; margin: 0 auto; display: grid; gap: var(--s4); }

  .desc { margin: 0; color: var(--text-muted); text-wrap: pretty; max-width: 60ch; }
  /* Card: outer radius 16, 8px bezel; panels inside use 16 - 8 = 8. */

  .panel { background: var(--surface-2); border-radius: var(--r-inner); padding: var(--s4); }
  #form { display: grid; gap: var(--s4); }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); margin-bottom: var(--s2); }
  label { font-weight: 600; line-height: 1.4; }
  .val { font-weight: 600; }
  .help { margin-top: var(--s1); font-size: 13px; color: var(--text-muted); text-wrap: pretty; }
  input, select, textarea {
    width: 100%;
    min-height: 40px;
    padding: var(--s2) var(--s3);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-inner);
    background: var(--bg);
    color: inherit;

    font-variant-numeric: tabular-nums;
    transition: border-color var(--t-fast) var(--ease);
  }
  input[type="range"] { padding: 0; min-height: 24px; accent-color: var(--focus); }
  input[type="checkbox"] { width: 20px; min-height: 20px; height: 20px; accent-color: var(--focus); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .outputs { display: grid; gap: var(--s2); align-content: start; }
  .out { background: var(--surface); border-radius: var(--r-inner); padding: var(--s3) var(--s4); }
  .out .label { font-size: 13px; color: var(--text-muted); }
  .out .value { margin-top: var(--s1); font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .out .err { margin-top: var(--s1); color: var(--bad); font-size: 13px; }
  footer { font-size: 13px; color: var(--text-muted); }
  @media (min-width: 700px) {

    .outputs { position: sticky; top: var(--s4); }
  }
  @media (max-width: 699px) {
    h1 { font-size: 26px; }
    input, select, textarea { font-size: 16px; }

  @media (prefers-reduced-motion: reduce) {

<main>

<script>
const TOOL = {"id":"tool-uk-arrival-checklist-mwcohcmb","name":"UK arrival checklist","description":"A first-month checklist for a student new to the UK: accounts, registration, travel, and the things nobody mentions.","category":"Student life","tags":["UK arrival","international students","first-month checklist","study and productivity","free sample","sravanisinha"],"fields":[{"id":"checklist_version","label":"Choose your checklist","type":"select","defaultValue":"sample","options":[{"label":"Free sample — first-day essentials","value":"sample"},{"label":"Full template — first month","value":"full"}],"help":"The free sample is ready to copy and send. The full template adds accounts, registration, travel and easily missed tasks."},{"id":"days_in_uk","label":"How many days since you arrived?","type":"number","defaultValue":0,"min":0,"max":365,"step":1,"unit":"days","help":"Use 0 before travelling or on arrival day. Your checklist suggests a focus, not an official deadline."},{"id":"uk_nation","label":"Where will you study?","type":"select","defaultValue":"england","options":[{"label":"England","value":"england"},{"label":"Scotland","value":"scotland"},{"label":"Wales","value":"wales"},{"label":"Northern Ireland","value":"northern_ireland"}]},{"id":"accommodation","label":"Your accommodation","type":"select","defaultValue":"halls","options":[{"label":"University or private student halls","value":"halls"},{"label":"Private rented home","value":"private_rental"},{"label":"Temporary accommodation or still looking","value":"temporary"}]},{"id":"bank_account_ready","label":"Suitable payment account ready","type":"toggle","defaultValue":false,"help":"Switch on if you already have an account you can use for everyday UK payments."},{"id":"gp_registered","label":"Registered with a local GP","type":"toggle","defaultValue":false,"help":"Switch on once your local GP practice has confirmed your registration."}],"outputs":[{"id":"accounts","label":"1. Accounts and first payments","format":"text","formula":"if(checklist_version == 'sample', 'FREE SAMPLE — FIRST DAY\\n☐ Save your accommodation address, arrival instructions and university emergency contact offline.\\n☐ Make sure you can pay for food and onward travel; keep a backup payment method separate.\\n☐ Check your mobile plan works in the UK and turn off expensive roaming if needed.\\nNext: the full template covers your first month in four short sections.', if(days_in_uk \u003c 3, 'YOUR FOCUS: settle safely, then handle urgent enrolment tasks. Suggested timing is not an official deadline.\\n', if(days_in_uk \u003c 8, 'YOUR FOCUS: finish essential account setup and registration this week. Check your university’s actual deadlines.\\n', 'YOUR FOCUS: clear unfinished essentials, then build your weekly routine. Check for any missed university deadlines.\\n')) + if(bank_account_ready, '☑ Payment account ready.\\n☐ Check transfer fees, cash withdrawal charges and payment limits.\\n', '☐ Compare suitable payment accounts: check eligibility, fees, payment features and any deposit protection.\\n☐ Check the provider’s accepted identity and address evidence before applying; ask your university for a bank letter if needed.\\n☐ Keep a backup payment method while the application is processed.\\n') + '☐ Set up a suitable mobile plan; check coverage where you live and study.\\n☐ Activate university email, the student portal and multi-factor authentication; store recovery codes securely.\\n☐ Record rent, tuition and essential bill due dates. Check amounts and payment details through official channels before transferring money.\\n☐ Draft a first-month budget covering rent, food, travel, laundry and a small emergency buffer.')"},{"id":"registration","label":"2. University, immigration and healthcare","format":"text","formula":"if(checklist_version == 'sample', 'FREE SAMPLE — DO NOT MISS\\n☐ Open your university’s arrival email and record your enrolment deadline and required documents.\\n☐ Save 999 for emergencies and find your university’s out-of-hours support details.\\n☐ Keep essential medication and prescription information accessible.', '☐ Complete university enrolment and any required identity or immigration checks by the university’s deadline.\\n☐ Collect your student ID and check your timetable, campus map and library access.\\n☐ If you have a UKVI account or eVisa, check your details and linked travel document; follow official instructions to correct errors.\\n☐ Check your own immigration conditions before working; do not assume every student has the same permitted hours.\\n' + if(gp_registered, '☑ GP registration confirmed.\\n☐ Save the practice contact details and check how to request appointments and repeat prescriptions.\\n', '☐ Find a local GP practice accepting patients and check how to register. Do not wait until you are ill.\\n☐ Ask how to arrange ongoing care or repeat prescriptions if you need them.\\n') + '☐ Ask about recommended vaccinations and support for any ongoing health needs.\\n☐ Check local urgent-care routes and dental arrangements; healthcare entitlement and charges depend on your circumstances.\\n☐ Save 999 for life-threatening emergencies and your university’s wellbeing and out-of-hours contacts.')"},{"id":"travel_and_study","label":"3. Travel and a manageable study routine","format":"text","formula":"if(checklist_version == 'sample', 'FREE SAMPLE — FIRST JOURNEY\\n☐ Save your route from the arrival airport or station to your accommodation, plus a backup.\\n☐ Check the last service time and luggage rules.\\n☐ Download an offline map and keep enough phone battery for the journey.', '☐ Test your route to campus before your first compulsory session; allow time to find the correct building.\\n☐ Compare walking, cycling and public transport costs before buying a pass.\\n' + if(uk_nation == 'northern_ireland', '☐ Check Translink routes, fares and current student or age-based travel offers; confirm eligibility before buying.\\n', if(uk_nation == 'scotland', '☐ Check local operators and whether you qualify for an age-based Scottish travel scheme; eligibility is not automatic for every student.\\n', if(uk_nation == 'wales', '☐ Check local operators and current Welsh age-based travel offers; confirm eligibility and where discounts apply.\\n', '☐ Check your local transport authority for student or age-based fares. London and other cities have different schemes.\\n'))) + '☐ If travelling by rail, compare any eligible railcard’s cost with realistic savings and check ticket restrictions.\\n☐ Put classes, travel time and university deadlines into one calendar.\\n☐ Choose two short independent-study blocks and one weekly admin slot.\\n☐ Find a quiet study space, an affordable food shop and a route home after evening sessions.')"},{"id":"easily_missed","label":"4. Housing and things nobody mentions","format":"text","formula":"if(checklist_version == 'sample', 'FREE SAMPLE — BEFORE YOU UNPACK\\n☐ Photograph your room and report existing damage in writing.\\n☐ Find the fire exit, reception or landlord contact and waste instructions.\\n☐ Put one practical admin task in tomorrow’s calendar. Stop here for today; the full template can be completed over your first month.', if(accommodation == 'halls', '☐ Read your halls rules, inventory and damage-reporting deadline; keep dated photos.\\n☐ Check what your rent includes, how laundry works and how to report a repair.\\n', if(accommodation == 'private_rental', '☐ Keep your tenancy agreement, inventory, dated photos and written repair reports together.\\n☐ Check which bills you pay; record meter readings where relevant.\\n☐ Check the deposit and tenancy rules for your UK nation, including whether deposit protection applies.\\n', '☐ Keep a confirmed short-term address and a backup place to stay.\\n☐ Ask university accommodation services for help finding longer-term housing.\\n☐ Verify the property, landlord or agent and agreement before sending money; be cautious about pressure to pay before checks.\\n')) + if(uk_nation == 'northern_ireland', '☐ Northern Ireland uses domestic rates rather than Council Tax. Check your tenancy and official guidance to establish responsibility and any applicable relief.\\n', '☐ Check Council Tax status with your council or accommodation provider. Qualifying full-time students may be exempt or disregarded, but paperwork and household circumstances matter; do not ignore a bill.\\n') + '☐ Check whether you need a TV Licence for your viewing habits; owning a television alone does not determine this.\\n☐ Find bin and recycling rules, parcel collection arrangements and the nearest laundrette if needed.\\n☐ Budget for bedding, kitchen basics, laundry, adapters and weatherproof clothing; check what is already supplied.\\n☐ Never share bank passwords, PINs or one-time codes. Verify unexpected payment or immigration demands independently using official contact details.\\n☐ Keep secure copies of essential documents and emergency contacts; update your address with relevant organisations after moving.\\n☐ At the end of week four, review spending, unfinished tasks and support needs. Schedule one low-pressure social activity.')"}],"createdAt":"2026-11-11T22:15:59.267Z","updatedAt":"2026-11-11T22:15:59.267Z"};

const HELPERS = {
  round: (n, d = 0) => { const f = 10 ** (d || 0); return Math.round(n * f) / f; },
  floor: (n) => Math.floor(n),
  ceil: (n) => Math.ceil(n),
  min: (...a) => Math.min(...a),
  max: (...a) => Math.max(...a),
  abs: (n) => Math.abs(n),
  pow: (a, b) => Math.pow(a, b),
  sqrt: (n) => Math.sqrt(n),
  clamp: (n, lo, hi) => Math.min(Math.max(n, lo), hi),
  if: (c, a, b) => (c ? a : b),
};

function tokenize(expr) {
  const tokens = [];
  let i = 0;
  while (i < expr.length) {
    const ch = expr[i];
    if (/\s/.test(ch)) { i++; continue; }
    if ((ch === "<" || ch === ">" || ch === "=" || ch === "!") && i + 1 < expr.length && expr[i + 1] === "=") {
      tokens.push(expr.slice(i, i + 2)); i += 2; continue;
    }
    if (ch === "<" || ch === ">") { tokens.push(ch); i++; continue; }
    if ("+-*/%(),".includes(ch)) { tokens.push(ch); i++; continue; }
    if (/[0-9.]/.test(ch)) {
      let j = i + 1; while (j < expr.length && /[0-9.]/.test(expr[j])) j++;
      tokens.push(expr.slice(i, j)); i = j; continue;
    }
    if (/[A-Za-z_]/.test(ch)) {
      let j = i + 1; while (j < expr.length && /[A-Za-z0-9_]/.test(expr[j])) j++;
      tokens.push(expr.slice(i, j)); i = j; continue;
    }
    throw new Error("Unexpected: " + ch);
  }
  return tokens;
}

function parse(tokens) {
  let i = 0;
  const peek = () => tokens[i];
  const take = () => tokens[i++];
  const expect = (t) => { if (take() !== t) throw new Error("Expected " + t); };
  function expr() { return comparison(); }
  function comparison() {
    let left = additive();
    while (peek() === "<" || peek() === ">" || peek() === "<=" || peek() === ">=" || peek() === "==" || peek() === "!=") {
      const op = take(); left = { k: "op", op, left, right: additive() };
    }
    return left;
  }
  function additive() {
    let left = term();
    while (peek() === "+" || peek() === "-") {
      const op = take(); left = { k: "op", op, left, right: term() };
    }
    return left;
  }
  function term() {
    let left = unary();
    while (peek() === "*" || peek() === "/" || peek() === "%") {
      const op = take(); left = { k: "op", op, left, right: unary() };
    }
    return left;
  }
  function unary() {
    if (peek() === "-") { take(); return { k: "unary", arg: unary() }; }
    return primary();
  }
  function primary() {
    const t = peek();
    if (t === undefined) throw new Error("EOF");
    if (/^[0-9.]/.test(t)) { take(); return { k: "num", v: Number(t) }; }
    if (t === "(") { take(); const n = expr(); expect(")"); return n; }
    if (/^[A-Za-z_]/.test(t)) {
      take();
      if (peek() === "(") {
        take();
        const args = [];
        if (peek() !== ")") {
          args.push(expr());
          while (peek() === ",") { take(); args.push(expr()); }
        }
        expect(")");
        return { k: "call", name: t, args };
      }
      return { k: "id", name: t };
    }
    throw new Error("Unexpected " + t);
  }
  const node = expr();
  if (i < tokens.length) throw new Error("Trailing tokens");
  return node;
}

function evalNode(node, vars) {
  switch (node.k) {
    case "num": return node.v;
    case "id": return vars[node.name] ?? 0;
    case "unary": return -evalNode(node.arg, vars);
    case "op": {
      const a = evalNode(node.left, vars), b = evalNode(node.right, vars);
      if (node.op === "+") return a + b;
      if (node.op === "-") return a - b;
      if (node.op === "*") return a * b;
      if (node.op === "/") return b === 0 ? NaN : a / b;
      if (node.op === "%") return a % b;
      if (node.op === "<") return a < b ? 1 : 0;
      if (node.op === ">") return a > b ? 1 : 0;
      if (node.op === "<=") return a <= b ? 1 : 0;
      if (node.op === ">=") return a >= b ? 1 : 0;
      if (node.op === "==") return a === b ? 1 : 0;
      if (node.op === "!=") return a !== b ? 1 : 0;
      throw new Error(node.op);
    }
    case "call": {
      const fn = HELPERS[node.name];
      if (!fn) throw new Error("Unknown " + node.name);
      return fn(...node.args.map((a) => evalNode(a, vars)));
    }
  }
}

function evaluate(formula, values) {
  try {
    const vars = {};
    for (const [k, v] of Object.entries(values)) {
      vars[k] = typeof v === "boolean" ? (v ? 1 : 0) : Number(v) || 0;
    }
    const value = evalNode(parse(tokenize(formula.trim())), vars);
    if (!Number.isFinite(value)) return { ok: false, error: "Not finite" };
    return { ok: true, value };
  } catch (e) {
    return { ok: false, error: e.message || "Error" };
  }
}

function format(value, format, prefix = "", suffix = "") {
  if (format === "currency") {
    return prefix + value.toLocaleString("en-GB", { style: "currency", currency: "GBP", maximumFractionDigits: 2 }) + suffix;
  }
  if (format === "percent") {
    return prefix + (value * 100).toLocaleString(undefined, { maximumFractionDigits: 2 }) + "%" + suffix;
  }
  return prefix + value.toLocaleString(undefined, { maximumFractionDigits: 4 }) + suffix;
}

const form = document.getElementById("form");
const outputsEl = document.getElementById("outputs");
document.getElementById("title").textContent = TOOL.name;
document.getElementById("desc").textContent = TOOL.description;

function renderFields() {
  form.innerHTML = "";
  for (const f of TOOL.fields) {
    const wrap = document.createElement("div");
    wrap.className = "field";
    const head = document.createElement("div");
    head.className = "head";
    const lab = document.createElement("label");
    lab.textContent = f.label + (f.unit ? " (" + f.unit + ")" : "");
    lab.htmlFor = f.id;
    head.appendChild(lab);
    wrap.appendChild(head);
    let input;
    if (f.type === "select") {
      input = document.createElement("select");
      for (const opt of (f.options || [])) {
        const o = document.createElement("option");
        o.value = opt.value; o.textContent = opt.label;
        if (String(f.defaultValue) === String(opt.value)) o.selected = true;
        input.appendChild(o);
      }
    } else if (f.type === "textarea") {
      input = document.createElement("textarea");
      input.rows = 3;
      input.value = f.defaultValue ?? "";
    } else if (f.type === "toggle") {
      input = document.createElement("input");
      input.type = "checkbox";
      input.checked = Boolean(f.defaultValue);
      input.style.width = "auto";
    } else if (f.type === "slider") {
      input = document.createElement("input");
      input.type = "range";
      input.min = f.min ?? 0; input.max = f.max ?? 100; input.step = f.step ?? 1;
      input.value = f.defaultValue ?? 0;
    } else if (f.type === "text") {
      input = document.createElement("input");
      input.type = "text";
      input.value = f.defaultValue ?? "";
      input.placeholder = f.placeholder || "";
    } else {
      input = document.createElement("input");
      input.type = "number";
      if (f.min != null) input.min = f.min;
      if (f.max != null) input.max = f.max;
      if (f.step != null) input.step = f.step;
      input.value = f.defaultValue ?? 0;
    }
    input.id = f.id;
    if (f.type === "slider") {
      const val = document.createElement("span");
      val.className = "val";
      val.setAttribute("aria-hidden", "true");
      val.textContent = input.value;
      head.appendChild(val);
      input.addEventListener("input", () => { val.textContent = input.value; });
    }
    input.addEventListener("input", compute);
    input.addEventListener("change", compute);
    wrap.appendChild(input);
    if (f.help) {
      const h = document.createElement("div");
      h.className = "help";
      h.textContent = f.help;
      wrap.appendChild(h);
    }
    form.appendChild(wrap);
  }
}

function readValues() {
  const values = {};
  for (const f of TOOL.fields) {
    const el = document.getElementById(f.id);
    if (!el) continue;
    if (f.type === "toggle") values[f.id] = el.checked;
    else if (f.type === "text" || f.type === "textarea" || f.type === "select") values[f.id] = el.value;
    else values[f.id] = Number(el.value);
  }
  return values;
}

function compute() {
  const values = readValues();
  outputsEl.innerHTML = "";
  for (const o of TOOL.outputs) {
    const box = document.createElement("div");
    box.className = "out";
    const lab = document.createElement("div");
    lab.className = "label";
    lab.textContent = o.label;
    box.appendChild(lab);
    const result = evaluate(o.formula, values);
    if (result.ok) {
      const v = document.createElement("div");
      v.className = "value";
      v.textContent = format(result.value, o.format || "number", o.prefix || "", o.suffix || "");
      box.appendChild(v);
    } else {
      const e = document.createElement("div");
      e.className = "err";
      e.textContent = result.error;
      box.appendChild(e);
    }
    if (o.description) {
      const d = document.createElement("div");
      d.className = "help";
      d.textContent = o.description;
      box.appendChild(d);
    }
    outputsEl.appendChild(box);
  }
}

renderFields();
compute();
</script>
