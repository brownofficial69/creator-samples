<script>
const TOOL = {"id":"tool-debt-payoff-planner-mwca3k3u","name":"Debt payoff planner","description":"A viewer lists balances and rates and sees a payoff order and a debt-free date, using the method the creator already teaches.","category":"Personal finance","tags":["debt payoff","UK","personal finance","snowball","avalanche","free sample"],"fields":[{"id":"debt_one_balance","label":"Debt 1 balance","type":"number","defaultValue":600,"min":0,"step":0.01,"unit":"£","help":"Use your latest balance. Keep a note of which account you call Debt 1."},{"id":"debt_one_rate","label":"Debt 1 annual interest rate","type":"number","defaultValue":24,"min":0,"max":100,"step":0.1,"unit":"%","help":"Enter the annual rate as a percentage, for example 24. APR divided by 12 is used as a monthly approximation."},{"id":"debt_two_balance","label":"Debt 2 balance","type":"number","defaultValue":1200,"min":0,"step":0.01,"unit":"£"},{"id":"debt_two_rate","label":"Debt 2 annual interest rate","type":"number","defaultValue":18,"min":0,"max":100,"step":0.1,"unit":"%"},{"id":"monthly_budget","label":"Total monthly debt repayment","type":"number","defaultValue":150,"min":0,"step":1,"unit":"£","help":"Include both minimum payments and any extra repayment. Check that this covers both lenders' minimums; this calculator does not check them."},{"id":"payoff_method","label":"Payoff method","type":"select","defaultValue":"avalanche","options":[{"label":"Avalanche — highest interest rate first","value":"avalanche"},{"label":"Snowball — smallest balance first","value":"snowball"}],"help":"Select the method the creator teaches. The sample defaults to avalanche, not a claim about the creator's existing advice. The conservative timeline is the same for both methods; only the priority order changes."},{"id":"start_month","label":"First repayment month","type":"number","placeholder":"202609","min":200001,"max":210012,"step":1,"help":"Required for the calendar estimate. Enter YYYYMM: September 2026 is 202609. Use a month from 01 to 12. The estimate assumes your first payment happens in this month."}],"outputs":[{"id":"payoff_order","label":"Your payoff order","formula":"if(debt_one_balance + debt_two_balance == 0, \"No debt entered\", if(debt_one_balance == 0, \"Debt 2 only\", if(debt_two_balance == 0, \"Debt 1 only\", if(payoff_method == \"snowball\", if(debt_one_balance \u003c= debt_two_balance, \"Debt 1, then Debt 2\", \"Debt 2, then Debt 1\"), if(debt_one_rate >= debt_two_rate, \"Debt 1, then Debt 2\", \"Debt 2, then Debt 1\")))))","format":"text","description":"Keep paying both minimums. Put extra money towards the first debt, then roll its payment into the second. Ties prioritise Debt 1."},{"id":"opening_month_interest","label":"Approximate opening monthly interest","formula":"round((debt_one_balance * debt_one_rate + debt_two_balance * debt_two_rate) / 1200, 2)","format":"currency","prefix":"","description":"The timeline reserves this amount every month, even as balances fall. This makes it conservative under the stated assumptions."},{"id":"repayment_months","label":"Conservative repayment time","formula":"if(debt_one_balance + debt_two_balance == 0, 0, if(monthly_budget \u003c= (debt_one_balance * debt_one_rate + debt_two_balance * debt_two_rate) / 1200, -1, ceil((debt_one_balance + debt_two_balance) / max(0.01, monthly_budget - (debt_one_balance * debt_one_rate + debt_two_balance * debt_two_rate) / 1200))))","format":"number","suffix":" months","description":"A planning estimate, not an amortisation schedule. −1 means the budget does not exceed estimated opening interest: increase it before estimating a payoff date. 0 means no balance remains."},{"id":"debt_free_month","label":"Conservative debt-free month (YYYYMM)","formula":"if(start_month % 100 \u003c 1, 0, if(start_month % 100 > 12, 0, if(debt_one_balance + debt_two_balance == 0, start_month, if(monthly_budget \u003c= (debt_one_balance * debt_one_rate + debt_two_balance * debt_two_rate) / 1200, 0, floor((floor(start_month / 100) * 12 + start_month % 100 - 2 + ceil((debt_one_balance + debt_two_balance) / max(0.01, monthly_budget - (debt_one_balance * debt_one_rate + debt_two_balance * debt_two_rate) / 1200))) / 12) * 100 + (floor(start_month / 100) * 12 + start_month % 100 - 2 + ceil((debt_one_balance + debt_two_balance) / max(0.01, monthly_budget - (debt_one_balance * debt_one_rate + debt_two_balance * debt_two_rate) / 1200))) % 12 + 1))))","format":"number","description":"Read 202709 as September 2027. 0 means no date is available: check the start month and repayment budget. This is a conservative target month, not a guaranteed date."}],"createdAt":"2026-11-11T15:33:21.162Z","updatedAt":"2026-11-11T15:33:21.162Z"};

const HELPERS = {
  round: (n, d = 0) => { const f = 10 ** (d || 0); return Math.round(n * f) / f; },
  floor: (n) => Math.floor(n),
  ceil: (n) => Math.ceil(n),
  min: (...a) => Math.min(...a),
  max: (...a) => Math.max(...a),
  abs: (n) => Math.abs(n),
  pow: (a, b) => Math.pow(a, b),
  sqrt: (n) => Math.sqrt(n),
  clamp: (n, lo, hi) => Math.min(Math.max(n, lo), hi),
  if: (c, a, b) => (c ? a : b),
};

function tokenize(expr) {
  const tokens = [];
  let i = 0;
  while (i < expr.length) {
    const ch = expr[i];
    if (/\s/.test(ch)) { i++; continue; }
    if ((ch === "<" || ch === ">" || ch === "=" || ch === "!") && i + 1 < expr.length && expr[i + 1] === "=") {
      tokens.push(expr.slice(i, i + 2)); i += 2; continue;
    }
    if (ch === "<" || ch === ">") { tokens.push(ch); i++; continue; }
    if ("+-*/%(),".includes(ch)) { tokens.push(ch); i++; continue; }
    if (/[0-9.]/.test(ch)) {
      let j = i + 1; while (j < expr.length && /[0-9.]/.test(expr[j])) j++;
      tokens.push(expr.slice(i, j)); i = j; continue;
    }
    if (/[A-Za-z_]/.test(ch)) {
      let j = i + 1; while (j < expr.length && /[A-Za-z0-9_]/.test(expr[j])) j++;
      tokens.push(expr.slice(i, j)); i = j; continue;
    }
    throw new Error("Unexpected: " + ch);
  }
  return tokens;
}

function parse(tokens) {
  let i = 0;
  const peek = () => tokens[i];
  const take = () => tokens[i++];
  const expect = (t) => { if (take() !== t) throw new Error("Expected " + t); };
  function expr() { return comparison(); }
  function comparison() {
    let left = additive();
    while (peek() === "<" || peek() === ">" || peek() === "<=" || peek() === ">=" || peek() === "==" || peek() === "!=") {
      const op = take(); left = { k: "op", op, left, right: additive() };
    }
    return left;
  }
  function additive() {
    let left = term();
    while (peek() === "+" || peek() === "-") {
      const op = take(); left = { k: "op", op, left, right: term() };
    }
    return left;
  }
  function term() {
    let left = unary();
    while (peek() === "*" || peek() === "/" || peek() === "%") {
      const op = take(); left = { k: "op", op, left, right: unary() };
    }
    return left;
  }
  function unary() {
    if (peek() === "-") { take(); return { k: "unary", arg: unary() }; }
    return primary();
  }
  function primary() {
    const t = peek();
    if (t === undefined) throw new Error("EOF");
    if (/^[0-9.]/.test(t)) { take(); return { k: "num", v: Number(t) }; }
    if (t === "(") { take(); const n = expr(); expect(")"); return n; }
    if (/^[A-Za-z_]/.test(t)) {
      take();
      if (peek() === "(") {
        take();
        const args = [];
        if (peek() !== ")") {
          args.push(expr());
          while (peek() === ",") { take(); args.push(expr()); }
        }
        expect(")");
        return { k: "call", name: t, args };
      }
      return { k: "id", name: t };
    }
    throw new Error("Unexpected " + t);
  }
  const node = expr();
  if (i < tokens.length) throw new Error("Trailing tokens");
  return node;
}

function evalNode(node, vars) {
  switch (node.k) {
    case "num": return node.v;
    case "id": return vars[node.name] ?? 0;
    case "unary": return -evalNode(node.arg, vars);
    case "op": {
      const a = evalNode(node.left, vars), b = evalNode(node.right, vars);
      if (node.op === "+") return a + b;
      if (node.op === "-") return a - b;
      if (node.op === "*") return a * b;
      if (node.op === "/") return b === 0 ? NaN : a / b;
      if (node.op === "%") return a % b;
      if (node.op === "<") return a < b ? 1 : 0;
      if (node.op === ">") return a > b ? 1 : 0;
      if (node.op === "<=") return a <= b ? 1 : 0;
      if (node.op === ">=") return a >= b ? 1 : 0;
      if (node.op === "==") return a === b ? 1 : 0;
      if (node.op === "!=") return a !== b ? 1 : 0;
      throw new Error(node.op);
    }
    case "call": {
      const fn = HELPERS[node.name];
      if (!fn) throw new Error("Unknown " + node.name);
      return fn(...node.args.map((a) => evalNode(a, vars)));
    }
  }
}

function evaluate(formula, values) {
  try {
    const vars = {};
    for (const [k, v] of Object.entries(values)) {
      vars[k] = typeof v === "boolean" ? (v ? 1 : 0) : Number(v) || 0;
    }
    const value = evalNode(parse(tokenize(formula.trim())), vars);
    if (!Number.isFinite(value)) return { ok: false, error: "Not finite" };
    return { ok: true, value };
  } catch (e) {
    return { ok: false, error: e.message || "Error" };
  }
}

function format(value, format, prefix = "", suffix = "") {
  if (format === "currency") {
    return prefix + value.toLocaleString("en-GB", { style: "currency", currency: "GBP", maximumFractionDigits: 2 }) + suffix;
  }
  if (format === "percent") {
    return prefix + (value * 100).toLocaleString(undefined, { maximumFractionDigits: 2 }) + "%" + suffix;
  }
  return prefix + value.toLocaleString(undefined, { maximumFractionDigits: 4 }) + suffix;
}

const form = document.getElementById("form");
const outputsEl = document.getElementById("outputs");
document.getElementById("title").textContent = TOOL.name;
document.getElementById("desc").textContent = TOOL.description;

function renderFields() {
  form.innerHTML = "";
  for (const f of TOOL.fields) {
    const wrap = document.createElement("div");
    wrap.className = "field";
    const head = document.createElement("div");
    head.className = "head";
    const lab = document.createElement("label");
    lab.textContent = f.label + (f.unit ? " (" + f.unit + ")" : "");
    lab.htmlFor = f.id;
    head.appendChild(lab);
    wrap.appendChild(head);
    let input;
    if (f.type === "select") {
      input = document.createElement("select");
      for (const opt of (f.options || [])) {
        const o = document.createElement("option");
        o.value = opt.value; o.textContent = opt.label;
        if (String(f.defaultValue) === String(opt.value)) o.selected = true;
        input.appendChild(o);
      }
    } else if (f.type === "textarea") {
      input = document.createElement("textarea");
      input.rows = 3;
      input.value = f.defaultValue ?? "";
    } else if (f.type === "toggle") {
      input = document.createElement("input");
      input.type = "checkbox";
      input.checked = Boolean(f.defaultValue);
      input.style.width = "auto";
    } else if (f.type === "slider") {
      input = document.createElement("input");
      input.type = "range";
      input.min = f.min ?? 0; input.max = f.max ?? 100; input.step = f.step ?? 1;
      input.value = f.defaultValue ?? 0;
    } else if (f.type === "text") {
      input = document.createElement("input");
      input.type = "text";
      input.value = f.defaultValue ?? "";
      input.placeholder = f.placeholder || "";
    } else {
      input = document.createElement("input");
      input.type = "number";
      if (f.min != null) input.min = f.min;
      if (f.max != null) input.max = f.max;
      if (f.step != null) input.step = f.step;
      input.value = f.defaultValue ?? 0;
    }
    input.id = f.id;
    if (f.type === "slider") {
      const val = document.createElement("span");
      val.className = "val";
      val.setAttribute("aria-hidden", "true");
      val.textContent = input.value;
      head.appendChild(val);
      input.addEventListener("input", () => { val.textContent = input.value; });
    }
    input.addEventListener("input", compute);
    input.addEventListener("change", compute);
    wrap.appendChild(input);
    if (f.help) {
      const h = document.createElement("div");
      h.className = "help";
      h.textContent = f.help;
      wrap.appendChild(h);
    }
    form.appendChild(wrap);
  }
}

function readValues() {
  const values = {};
  for (const f of TOOL.fields) {
    const el = document.getElementById(f.id);
    if (!el) continue;
    if (f.type === "toggle") values[f.id] = el.checked;
    else if (f.type === "text" || f.type === "textarea" || f.type === "select") values[f.id] = el.value;
    else values[f.id] = Number(el.value);
  }
  return values;
}

function compute() {
  const values = readValues();
  outputsEl.innerHTML = "";
  for (const o of TOOL.outputs) {
    const box = document.createElement("div");
    box.className = "out";
    const lab = document.createElement("div");
    lab.className = "label";
    lab.textContent = o.label;
    box.appendChild(lab);
    const result = evaluate(o.formula, values);
    if (result.ok) {
      const v = document.createElement("div");
      v.className = "value";
      v.textContent = format(result.value, o.format || "number", o.prefix || "", o.suffix || "");
      box.appendChild(v);
    } else {
      const e = document.createElement("div");
      e.className = "err";
      e.textContent = result.error;
      box.appendChild(e);
    }
    if (o.description) {
      const d = document.createElement("div");
      d.className = "help";
      d.textContent = o.description;
      box.appendChild(d);
    }
    outputsEl.appendChild(box);
  }
}

renderFields();
compute();
</script>
