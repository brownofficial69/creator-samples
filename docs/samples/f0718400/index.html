<style>
  /* Creator Pipeline design tokens, same names as Craftbench. Light by default, dark when the viewer's system is dark. */
  :root {
    color-scheme: light dark;
    --bg: #f5f2e9;
    --surface: #ffffff;
    --surface-2: #efebe0;
    --line-strong: #7d7663;
    --text: #1c1a12;
    --text-muted: #5a5342;
    --focus: #8a5a00;
    --bad: #a8402a;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 40px;
    --r-outer: 16px;
    --pad: 8px;
    --r-inner: calc(var(--r-outer) - var(--pad));
    --font: "Segoe UI", system-ui, sans-serif;
    --t-fast: 120ms;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12140f;
      --surface: #1b1f18;
      --surface-2: #20251c;
      --line-strong: #78836a;
      --text: #f3efe2;
      --text-muted: #b9b19d;
      --focus: #e4a23a;
      --bad: #e8826a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: var(--s5) var(--s4) var(--s6);
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 var(--font);
    font-variant-numeric: tabular-nums;
  }
  main { max-width: 880px; margin: 0 auto; display: grid; gap: var(--s4); }
  h1 { margin: 0; font-size: 32px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 650; text-wrap: balance; }
  .desc { margin: 0; color: var(--text-muted); text-wrap: pretty; max-width: 60ch; }
  /* Card: outer radius 16, 8px bezel; panels inside use 16 - 8 = 8. */
  .tool { background: var(--surface); border-radius: var(--r-outer); padding: var(--pad); display: grid; gap: var(--pad); }
  .panel { background: var(--surface-2); border-radius: var(--r-inner); padding: var(--s4); }
  #form { display: grid; gap: var(--s4); }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); margin-bottom: var(--s2); }
  label { font-weight: 600; line-height: 1.4; }
  .val { font-weight: 600; }
  .help { margin-top: var(--s1); font-size: 13px; color: var(--text-muted); text-wrap: pretty; }
  input, select, textarea {
    width: 100%;
    min-height: 40px;
    padding: var(--s2) var(--s3);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-inner);
    background: var(--bg);
    color: inherit;
    font: inherit;
    font-variant-numeric: tabular-nums;
    transition: border-color var(--t-fast) var(--ease);
  }
  input[type="range"] { padding: 0; min-height: 24px; accent-color: var(--focus); }
  input[type="checkbox"] { width: 20px; min-height: 20px; height: 20px; accent-color: var(--focus); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .outputs { display: grid; gap: var(--s2); align-content: start; }
  .out { background: var(--surface); border-radius: var(--r-inner); padding: var(--s3) var(--s4); }
  .out .label { font-size: 13px; color: var(--text-muted); }
  .out .value { margin-top: var(--s1); font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .out .err { margin-top: var(--s1); color: var(--bad); font-size: 13px; }
  footer { font-size: 13px; color: var(--text-muted); }
  @media (min-width: 700px) {
    .tool { grid-template-columns: minmax(0, 1fr) minmax(0, 0.9fr); align-items: start; }
    .outputs { position: sticky; top: var(--s4); }
  }
  @media (max-width: 699px) {
    h1 { font-size: 26px; }
    input, select, textarea { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<body>
<main>
  <h1 id="title"></h1>
  <p class="desc" id="desc"></p>
  <div class="tool">
    <form id="form" class="panel" onsubmit="return false"></form>
    <div class="panel outputs" id="outputs" role="group" aria-label="Results" aria-live="polite"></div>
  </div>
  <footer>Made with Craftbench. Works offline.</footer>
</main>
<script>
const TOOL = {"id":"tool-weekly-reflection-journal-builder-mwc8xmcu","name":"Weekly reflection journal","description":"Weekly prompts taken from the creator's own reminders, with room to write.","category":"Digital product planners","tags":["weekly reflection","journal template","creator-owned reminders","Muslim lifestyle","modest fashion","free sample"],"fields":[{"id":"weekly_template","label":"Weekly journal page","type":"textarea","defaultValue":"WEEKLY REFLECTION JOURNAL\n\nWeek beginning: ____________________\n\nAllow around 10 minutes. Use as much or as little of the writing space as you wish.\n\nCREATOR'S OWN REMINDER\n[Creator: paste your own reminder here.]\n\nCREATOR'S OWN WEEKLY PROMPT\n[Creator: write a reflection question drawn from your reminder here.]\n\nMY REFLECTION\n________________________________________________\n________________________________________________\n________________________________________________\n________________________________________________\n________________________________________________\n________________________________________________\n\nOPTIONAL SECOND PROMPT — CREATOR'S OWN WORDS\n[Creator: add another question from your reminder, or remove this section.]\n\nSPACE TO WRITE\n________________________________________________\n________________________________________________\n________________________________________________\n________________________________________________\n\nNOTES TO RETURN TO\n________________________________________________\n________________________________________________","help":"Use a different creator-supplied reminder and prompt for each week. Leave labelled spaces blank until the creator supplies or approves the words. Do not insert generated religious wording, rulings, hadith, verses, du'a or religious advice."},{"id":"free_sample","label":"Prepare the free sample first","type":"toggle","defaultValue":true,"help":"Creates a one-page sample with no build fee or revenue share applied. The creator can send it before agreeing a paid arrangement."},{"id":"journal_weeks","label":"Weeks in the full journal","type":"number","defaultValue":4,"min":1,"max":12,"step":1,"unit":"weeks","help":"Allow one reflection page per week. The free sample always contains one weekly page."},{"id":"pricing_model","label":"Proposed build arrangement","type":"select","defaultValue":"flat_fee","options":[{"label":"Flat build fee","value":"flat_fee"},{"label":"Revenue share","value":"revenue_share"}],"help":"Choose one arrangement for discussion with the creator. No payment or agreement is made by this tool."},{"id":"flat_fee","label":"Proposed flat build fee","type":"number","defaultValue":200,"min":150,"max":300,"step":10,"unit":"GBP","help":"Applies only to the full journal under the flat-fee arrangement."},{"id":"revenue_share","label":"Proposed builder revenue share","type":"number","defaultValue":20,"min":0,"max":100,"step":1,"unit":"%","help":"An editable discussion figure, not an agreed term. Agree the revenue basis, deductions, reporting and payment period separately."}],"outputs":[{"id":"journal_page","label":"Copy-ready weekly page template","formula":"weekly_template","format":"text","description":"Use once for the free sample, or duplicate for the full journal. Replace the labelled creator spaces with her own words before sharing."},{"id":"weekly_pages","label":"Weekly reflection pages","formula":"if(free_sample, 1, journal_weeks)","format":"number","suffix":" pages","description":"One short sitting per page. Each full-journal page needs its own creator-supplied reminder and prompt."},{"id":"proposed_build_fee","label":"Proposed flat build fee","formula":"if(free_sample, 0, if(pricing_model == \"flat_fee\", flat_fee, 0))","format":"currency","prefix":"","description":"£0 for the free sample or revenue-share option. Otherwise, the proposed one-off build fee; not the journal's retail price."},{"id":"proposed_builder_share","label":"Proposed builder revenue share","formula":"if(free_sample, 0, if(pricing_model == \"revenue_share\", revenue_share / 100, 0))","format":"percent","description":"Zero for the free sample or flat-fee option. Any non-zero share remains subject to a separate agreement."}],"createdAt":"2026-11-11T15:00:44.526Z","updatedAt":"2026-11-11T15:00:44.526Z"};

const HELPERS = {
  round: (n, d = 0) => { const f = 10 ** (d || 0); return Math.round(n * f) / f; },
  floor: (n) => Math.floor(n),
  ceil: (n) => Math.ceil(n),
  min: (...a) => Math.min(...a),
  max: (...a) => Math.max(...a),
  abs: (n) => Math.abs(n),
  pow: (a, b) => Math.pow(a, b),
  sqrt: (n) => Math.sqrt(n),
  clamp: (n, lo, hi) => Math.min(Math.max(n, lo), hi),
  if: (c, a, b) => (c ? a : b),
};

function tokenize(expr) {
  const tokens = [];
  let i = 0;
  while (i < expr.length) {
    const ch = expr[i];
    if (/\s/.test(ch)) { i++; continue; }
    if ((ch === "<" || ch === ">" || ch === "=" || ch === "!") && i + 1 < expr.length && expr[i + 1] === "=") {
      tokens.push(expr.slice(i, i + 2)); i += 2; continue;
    }
    if (ch === "<" || ch === ">") { tokens.push(ch); i++; continue; }
    if ("+-*/%(),".includes(ch)) { tokens.push(ch); i++; continue; }
    if (/[0-9.]/.test(ch)) {
      let j = i + 1; while (j < expr.length && /[0-9.]/.test(expr[j])) j++;
      tokens.push(expr.slice(i, j)); i = j; continue;
    }
    if (/[A-Za-z_]/.test(ch)) {
      let j = i + 1; while (j < expr.length && /[A-Za-z0-9_]/.test(expr[j])) j++;
      tokens.push(expr.slice(i, j)); i = j; continue;
    }
    throw new Error("Unexpected: " + ch);
  }
  return tokens;
}

function parse(tokens) {
  let i = 0;
  const peek = () => tokens[i];
  const take = () => tokens[i++];
  const expect = (t) => { if (take() !== t) throw new Error("Expected " + t); };
  function expr() { return comparison(); }
  function comparison() {
    let left = additive();
    while (peek() === "<" || peek() === ">" || peek() === "<=" || peek() === ">=" || peek() === "==" || peek() === "!=") {
      const op = take(); left = { k: "op", op, left, right: additive() };
    }
    return left;
  }
  function additive() {
    let left = term();
    while (peek() === "+" || peek() === "-") {
      const op = take(); left = { k: "op", op, left, right: term() };
    }
    return left;
  }
  function term() {
    let left = unary();
    while (peek() === "*" || peek() === "/" || peek() === "%") {
      const op = take(); left = { k: "op", op, left, right: unary() };
    }
    return left;
  }
  function unary() {
    if (peek() === "-") { take(); return { k: "unary", arg: unary() }; }
    return primary();
  }
  function primary() {
    const t = peek();
    if (t === undefined) throw new Error("EOF");
    if (/^[0-9.]/.test(t)) { take(); return { k: "num", v: Number(t) }; }
    if (t === "(") { take(); const n = expr(); expect(")"); return n; }
    if (/^[A-Za-z_]/.test(t)) {
      take();
      if (peek() === "(") {
        take();
        const args = [];
        if (peek() !== ")") {
          args.push(expr());
          while (peek() === ",") { take(); args.push(expr()); }
        }
        expect(")");
        return { k: "call", name: t, args };
      }
      return { k: "id", name: t };
    }
    throw new Error("Unexpected " + t);
  }
  const node = expr();
  if (i < tokens.length) throw new Error("Trailing tokens");
  return node;
}

function evalNode(node, vars) {
  switch (node.k) {
    case "num": return node.v;
    case "id": return vars[node.name] ?? 0;
    case "unary": return -evalNode(node.arg, vars);
    case "op": {
      const a = evalNode(node.left, vars), b = evalNode(node.right, vars);
      if (node.op === "+") return a + b;
      if (node.op === "-") return a - b;
      if (node.op === "*") return a * b;
      if (node.op === "/") return b === 0 ? NaN : a / b;
      if (node.op === "%") return a % b;
      if (node.op === "<") return a < b ? 1 : 0;
      if (node.op === ">") return a > b ? 1 : 0;
      if (node.op === "<=") return a <= b ? 1 : 0;
      if (node.op === ">=") return a >= b ? 1 : 0;
      if (node.op === "==") return a === b ? 1 : 0;
      if (node.op === "!=") return a !== b ? 1 : 0;
      throw new Error(node.op);
    }
    case "call": {
      const fn = HELPERS[node.name];
      if (!fn) throw new Error("Unknown " + node.name);
      return fn(...node.args.map((a) => evalNode(a, vars)));
    }
  }
}

function evaluate(formula, values) {
  try {
    const vars = {};
    for (const [k, v] of Object.entries(values)) {
      vars[k] = typeof v === "boolean" ? (v ? 1 : 0) : Number(v) || 0;
    }
    const value = evalNode(parse(tokenize(formula.trim())), vars);
    if (!Number.isFinite(value)) return { ok: false, error: "Not finite" };
    return { ok: true, value };
  } catch (e) {
    return { ok: false, error: e.message || "Error" };
  }
}

function format(value, format, prefix = "", suffix = "") {
  if (format === "currency") {
    return prefix + value.toLocaleString("en-GB", { style: "currency", currency: "GBP", maximumFractionDigits: 2 }) + suffix;
  }
  if (format === "percent") {
    return prefix + (value * 100).toLocaleString(undefined, { maximumFractionDigits: 2 }) + "%" + suffix;
  }
  return prefix + value.toLocaleString(undefined, { maximumFractionDigits: 4 }) + suffix;
}

const form = document.getElementById("form");
const outputsEl = document.getElementById("outputs");
document.getElementById("title").textContent = TOOL.name;
document.getElementById("desc").textContent = TOOL.description;

function renderFields() {
  form.innerHTML = "";
  for (const f of TOOL.fields) {
    const wrap = document.createElement("div");
    wrap.className = "field";
    const head = document.createElement("div");
    head.className = "head";
    const lab = document.createElement("label");
    lab.textContent = f.label + (f.unit ? " (" + f.unit + ")" : "");
    lab.htmlFor = f.id;
    head.appendChild(lab);
    wrap.appendChild(head);
    let input;
    if (f.type === "select") {
      input = document.createElement("select");
      for (const opt of (f.options || [])) {
        const o = document.createElement("option");
        o.value = opt.value; o.textContent = opt.label;
        if (String(f.defaultValue) === String(opt.value)) o.selected = true;
        input.appendChild(o);
      }
    } else if (f.type === "textarea") {
      input = document.createElement("textarea");
      input.rows = 3;
      input.value = f.defaultValue ?? "";
    } else if (f.type === "toggle") {
      input = document.createElement("input");
      input.type = "checkbox";
      input.checked = Boolean(f.defaultValue);
      input.style.width = "auto";
    } else if (f.type === "slider") {
      input = document.createElement("input");
      input.type = "range";
      input.min = f.min ?? 0; input.max = f.max ?? 100; input.step = f.step ?? 1;
      input.value = f.defaultValue ?? 0;
    } else if (f.type === "text") {
      input = document.createElement("input");
      input.type = "text";
      input.value = f.defaultValue ?? "";
      input.placeholder = f.placeholder || "";
    } else {
      input = document.createElement("input");
      input.type = "number";
      if (f.min != null) input.min = f.min;
      if (f.max != null) input.max = f.max;
      if (f.step != null) input.step = f.step;
      input.value = f.defaultValue ?? 0;
    }
    input.id = f.id;
    if (f.type === "slider") {
      const val = document.createElement("span");
      val.className = "val";
      val.setAttribute("aria-hidden", "true");
      val.textContent = input.value;
      head.appendChild(val);
      input.addEventListener("input", () => { val.textContent = input.value; });
    }
    input.addEventListener("input", compute);
    input.addEventListener("change", compute);
    wrap.appendChild(input);
    if (f.help) {
      const h = document.createElement("div");
      h.className = "help";
      h.textContent = f.help;
      wrap.appendChild(h);
    }
    form.appendChild(wrap);
  }
}

function readValues() {
  const values = {};
  for (const f of TOOL.fields) {
    const el = document.getElementById(f.id);
    if (!el) continue;
    if (f.type === "toggle") values[f.id] = el.checked;
    else if (f.type === "text" || f.type === "textarea" || f.type === "select") values[f.id] = el.value;
    else values[f.id] = Number(el.value);
  }
  return values;
}

function compute() {
  const values = readValues();
  outputsEl.innerHTML = "";
  for (const o of TOOL.outputs) {
    const box = document.createElement("div");
    box.className = "out";
    const lab = document.createElement("div");
    lab.className = "label";
    lab.textContent = o.label;
    box.appendChild(lab);
    const result = evaluate(o.formula, values);
    if (result.ok) {
      const v = document.createElement("div");
      v.className = "value";
      v.textContent = format(result.value, o.format || "number", o.prefix || "", o.suffix || "");
      box.appendChild(v);
    } else {
      const e = document.createElement("div");
      e.className = "err";
      e.textContent = result.error;
      box.appendChild(e);
    }
    if (o.description) {
      const d = document.createElement("div");
      d.className = "help";
      d.textContent = o.description;
      box.appendChild(d);
    }
    outputsEl.appendChild(box);
  }
}

renderFields();
compute();
</script>
