  * { box-sizing: border-box; }
  body {

    padding: var(--s5) var(--s4) var(--s6);

<script>
const TOOL = {"id":"tool-student-budget-planner-mwc6wmb9","name":"Student budget planner","description":"Splits a loan instalment across the term: rent, food, and what is left each week.","category":"Student budgeting","tags":["student budget","student finance","term planner","mature students","student parents","free sample"],"fields":[{"id":"loan_instalment","label":"Loan instalment for this term","type":"number","defaultValue":3000,"min":0,"step":0.01,"unit":"£","help":"Enter the maintenance loan payment available for living costs, not tuition fees."},{"id":"term_weeks","label":"Weeks this money needs to cover","type":"number","defaultValue":10,"min":1,"max":52,"step":1,"unit":"weeks","help":"Count until your next payment, including any holiday weeks this money must cover."},{"id":"other_income","label":"Other money available for this period","type":"number","defaultValue":0,"min":0,"step":0.01,"unit":"£","help":"Optional: add confirmed take-home pay, grants or other household contributions for the whole period. Do not include the loan again."},{"id":"weekly_rent","label":"Your weekly rent share","type":"number","defaultValue":150,"min":0,"step":0.01,"unit":"£/week","help":"Include only the share you pay. To estimate weekly rent from a monthly amount, multiply by 12 and divide by 52."},{"id":"weekly_food","label":"Weekly food budget","type":"number","defaultValue":45,"min":0,"step":0.01,"unit":"£/week","help":"Use the food costs you cover, including children’s meals if relevant."},{"id":"weekly_essentials","label":"Other weekly essentials","type":"number","defaultValue":35,"min":0,"step":0.01,"unit":"£/week","help":"Include bills not covered by rent, travel, childcare, course costs and repayments. Spread any one-off costs across the weeks above."}],"outputs":[{"id":"rent_set_aside","label":"Set aside for rent","formula":"round(weekly_rent * term_weeks, 2)","format":"currency","prefix":"","description":"Your rent allocation for the full period."},{"id":"food_set_aside","label":"Set aside for food","formula":"round(weekly_food * term_weeks, 2)","format":"currency","prefix":"","description":"Your food allocation for the full period."},{"id":"essentials_set_aside","label":"Set aside for other essentials","formula":"round(weekly_essentials * term_weeks, 2)","format":"currency","prefix":"","description":"Your other essential costs for the full period."},{"id":"weekly_remaining","label":"Left each week — or weekly shortfall","formula":"round((loan_instalment + other_income) / max(1, term_weeks) - weekly_rent - weekly_food - weekly_essentials, 2)","format":"currency","prefix":"","suffix":" per week","description":"After the costs entered, a positive figure is available for savings, unexpected costs or flexible spending. A negative figure is the weekly shortfall to address. The free sample leaves £70 a week."}],"createdAt":"2026-11-11T14:03:58.580Z","updatedAt":"2026-11-11T14:03:58.580Z"};

const HELPERS = {
  round: (n, d = 0) => { const f = 10 ** (d || 0); return Math.round(n * f) / f; },
  floor: (n) => Math.floor(n),
  ceil: (n) => Math.ceil(n),
  min: (...a) => Math.min(...a),
  max: (...a) => Math.max(...a),
  abs: (n) => Math.abs(n),
  pow: (a, b) => Math.pow(a, b),
  sqrt: (n) => Math.sqrt(n),
  clamp: (n, lo, hi) => Math.min(Math.max(n, lo), hi),
  if: (c, a, b) => (c ? a : b),
};

function tokenize(expr) {
  const tokens = [];
  let i = 0;
  while (i < expr.length) {
    const ch = expr[i];
    if (/\s/.test(ch)) { i++; continue; }
    if ((ch === "<" || ch === ">" || ch === "=" || ch === "!") && i + 1 < expr.length && expr[i + 1] === "=") {
      tokens.push(expr.slice(i, i + 2)); i += 2; continue;
    }
    if (ch === "<" || ch === ">") { tokens.push(ch); i++; continue; }
    if ("+-*/%(),".includes(ch)) { tokens.push(ch); i++; continue; }
    if (/[0-9.]/.test(ch)) {
      let j = i + 1; while (j < expr.length && /[0-9.]/.test(expr[j])) j++;
      tokens.push(expr.slice(i, j)); i = j; continue;
    }
    if (/[A-Za-z_]/.test(ch)) {
      let j = i + 1; while (j < expr.length && /[A-Za-z0-9_]/.test(expr[j])) j++;
      tokens.push(expr.slice(i, j)); i = j; continue;
    }
    throw new Error("Unexpected: " + ch);
  }
  return tokens;
}

function parse(tokens) {
  let i = 0;
  const peek = () => tokens[i];
  const take = () => tokens[i++];
  const expect = (t) => { if (take() !== t) throw new Error("Expected " + t); };
  function expr() { return comparison(); }
  function comparison() {
    let left = additive();
    while (peek() === "<" || peek() === ">" || peek() === "<=" || peek() === ">=" || peek() === "==" || peek() === "!=") {
      const op = take(); left = { k: "op", op, left, right: additive() };
    }
    return left;
  }
  function additive() {
    let left = term();
    while (peek() === "+" || peek() === "-") {
      const op = take(); left = { k: "op", op, left, right: term() };
    }
    return left;
  }
  function term() {
    let left = unary();
    while (peek() === "*" || peek() === "/" || peek() === "%") {
      const op = take(); left = { k: "op", op, left, right: unary() };
    }
    return left;
  }
  function unary() {
    if (peek() === "-") { take(); return { k: "unary", arg: unary() }; }
    return primary();
  }
  function primary() {
    const t = peek();
    if (t === undefined) throw new Error("EOF");
    if (/^[0-9.]/.test(t)) { take(); return { k: "num", v: Number(t) }; }
    if (t === "(") { take(); const n = expr(); expect(")"); return n; }
    if (/^[A-Za-z_]/.test(t)) {
      take();
      if (peek() === "(") {
        take();
        const args = [];
        if (peek() !== ")") {
          args.push(expr());
          while (peek() === ",") { take(); args.push(expr()); }
        }
        expect(")");
        return { k: "call", name: t, args };
      }
      return { k: "id", name: t };
    }
    throw new Error("Unexpected " + t);
  }
  const node = expr();
  if (i < tokens.length) throw new Error("Trailing tokens");
  return node;
}

function evalNode(node, vars) {
  switch (node.k) {
    case "num": return node.v;
    case "id": return vars[node.name] ?? 0;
    case "unary": return -evalNode(node.arg, vars);
    case "op": {
      const a = evalNode(node.left, vars), b = evalNode(node.right, vars);
      if (node.op === "+") return a + b;
      if (node.op === "-") return a - b;
      if (node.op === "*") return a * b;
      if (node.op === "/") return b === 0 ? NaN : a / b;
      if (node.op === "%") return a % b;
      if (node.op === "<") return a < b ? 1 : 0;
      if (node.op === ">") return a > b ? 1 : 0;
      if (node.op === "<=") return a <= b ? 1 : 0;
      if (node.op === ">=") return a >= b ? 1 : 0;
      if (node.op === "==") return a === b ? 1 : 0;
      if (node.op === "!=") return a !== b ? 1 : 0;
      throw new Error(node.op);
    }
    case "call": {
      const fn = HELPERS[node.name];
      if (!fn) throw new Error("Unknown " + node.name);
      return fn(...node.args.map((a) => evalNode(a, vars)));
    }
  }
}

function evaluate(formula, values) {
  try {
    const vars = {};
    for (const [k, v] of Object.entries(values)) {
      vars[k] = typeof v === "boolean" ? (v ? 1 : 0) : Number(v) || 0;
    }
    const value = evalNode(parse(tokenize(formula.trim())), vars);
    if (!Number.isFinite(value)) return { ok: false, error: "Not finite" };
    return { ok: true, value };
  } catch (e) {
    return { ok: false, error: e.message || "Error" };
  }
}

function format(value, format, prefix = "", suffix = "") {
  if (format === "currency") {
    return prefix + value.toLocaleString("en-GB", { style: "currency", currency: "GBP", maximumFractionDigits: 2 }) + suffix;
  }
  if (format === "percent") {
    return prefix + (value * 100).toLocaleString(undefined, { maximumFractionDigits: 2 }) + "%" + suffix;
  }
  return prefix + value.toLocaleString(undefined, { maximumFractionDigits: 4 }) + suffix;
}

const form = document.getElementById("form");
const outputsEl = document.getElementById("outputs");
document.getElementById("title").textContent = TOOL.name;
document.getElementById("desc").textContent = TOOL.description;

function renderFields() {
  form.innerHTML = "";
  for (const f of TOOL.fields) {
    const wrap = document.createElement("div");
    wrap.className = "field";
    const head = document.createElement("div");
    head.className = "head";
    const lab = document.createElement("label");
    lab.textContent = f.label + (f.unit ? " (" + f.unit + ")" : "");
    lab.htmlFor = f.id;
    head.appendChild(lab);
    wrap.appendChild(head);
    let input;
    if (f.type === "select") {
      input = document.createElement("select");
      for (const opt of (f.options || [])) {
        const o = document.createElement("option");
        o.value = opt.value; o.textContent = opt.label;
        if (String(f.defaultValue) === String(opt.value)) o.selected = true;
        input.appendChild(o);
      }
    } else if (f.type === "textarea") {
      input = document.createElement("textarea");
      input.rows = 3;
      input.value = f.defaultValue ?? "";
    } else if (f.type === "toggle") {
      input = document.createElement("input");
      input.type = "checkbox";
      input.checked = Boolean(f.defaultValue);
      input.style.width = "auto";
    } else if (f.type === "slider") {
      input = document.createElement("input");
      input.type = "range";
      input.min = f.min ?? 0; input.max = f.max ?? 100; input.step = f.step ?? 1;
      input.value = f.defaultValue ?? 0;
    } else if (f.type === "text") {
      input = document.createElement("input");
      input.type = "text";
      input.value = f.defaultValue ?? "";
      input.placeholder = f.placeholder || "";
    } else {
      input = document.createElement("input");
      input.type = "number";
      if (f.min != null) input.min = f.min;
      if (f.max != null) input.max = f.max;
      if (f.step != null) input.step = f.step;
      input.value = f.defaultValue ?? 0;
    }
    input.id = f.id;
    if (f.type === "slider") {
      const val = document.createElement("span");
      val.className = "val";
      val.setAttribute("aria-hidden", "true");
      val.textContent = input.value;
      head.appendChild(val);
      input.addEventListener("input", () => { val.textContent = input.value; });
    }
    input.addEventListener("input", compute);
    input.addEventListener("change", compute);
    wrap.appendChild(input);
    if (f.help) {
      const h = document.createElement("div");
      h.className = "help";
      h.textContent = f.help;
      wrap.appendChild(h);
    }
    form.appendChild(wrap);
  }
}

function readValues() {
  const values = {};
  for (const f of TOOL.fields) {
    const el = document.getElementById(f.id);
    if (!el) continue;
    if (f.type === "toggle") values[f.id] = el.checked;
    else if (f.type === "text" || f.type === "textarea" || f.type === "select") values[f.id] = el.value;
    else values[f.id] = Number(el.value);
  }
  return values;
}

function compute() {
  const values = readValues();
  outputsEl.innerHTML = "";
  for (const o of TOOL.outputs) {
    const box = document.createElement("div");
    box.className = "out";
    const lab = document.createElement("div");
    lab.className = "label";
    lab.textContent = o.label;
    box.appendChild(lab);
    const result = evaluate(o.formula, values);
    if (result.ok) {
      const v = document.createElement("div");
      v.className = "value";
      v.textContent = format(result.value, o.format || "number", o.prefix || "", o.suffix || "");
      box.appendChild(v);
    } else {
      const e = document.createElement("div");
      e.className = "err";
      e.textContent = result.error;
      box.appendChild(e);
    }
    if (o.description) {
      const d = document.createElement("div");
      d.className = "help";
      d.textContent = o.description;
      box.appendChild(d);
    }
    outputsEl.appendChild(box);
  }
}

renderFields();
compute();
</script>
